<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rating Dein | ApnaShift</title>
<meta name="description" content="Apni poori hui trip ko star rating do.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14213d;
    --yellow:#fcbf49;
    --bg:#f4f6fa;
    --border:#c9d0de;
    --ink:#20242e;
    --muted:#5b6070;
    --red:#c0392b;
    --green:#1a7a3a;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height:1.6;
  }
  :focus-visible{
    outline:3px solid var(--navy);
    outline-offset:2px;
    box-shadow:0 0 0 6px var(--yellow);
    border-radius:8px;
  }
  .site-header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:50}
  .site-header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .site-brand{font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;font-weight:800;font-size:1.3rem;line-height:1;color:#fff;text-decoration:none}
  .site-brand small{display:block;font-family:"Noto Sans",system-ui,sans-serif;font-weight:600;font-size:.64rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--yellow)}
  .site-nav{display:flex;gap:4px;margin-left:8px;align-items:center}
  .site-nav> a{color:#dbe2f0;text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 10px;border-radius:8px}
  .site-nav> a:hover{background:#1f2f52;color:#fff}
  #navMenuBtn{display:none;background:transparent;border:2px solid var(--yellow);border-radius:8px;color:var(--yellow);font:inherit;font-weight:800;padding:6px 12px;cursor:pointer}
  @media (max-width:760px){#navMenuBtn{display:block;margin-left:auto}.site-nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--navy);flex-direction:column;align-items:stretch;padding:8px 16px 14px;margin:0}.site-nav.open{display:flex}.site-header-inner{flex-wrap:wrap;position:relative}}
  main{max-width:960px;margin:0 auto;padding:20px 16px 40px}
  h1{font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;color:var(--navy);font-size:1.6rem;margin:0 0 6px}
  .sub{margin:0 0 12px;color:var(--muted);font-size:.9rem}
  .card{background:#fff;border:2px solid var(--navy);border-radius:var(--radius);padding:18px;box-shadow:6px 6px 0 var(--yellow);margin-bottom:16px}
  .card h2{font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;color:var(--navy);font-size:1.2rem;margin:0 0 8px}
  #pageAlert{display:none;border-radius:10px;padding:11px 12px;font-size:.9rem;font-weight:600;margin:0 0 14px}
  #pageAlert.show{display:block}
  #pageAlert.err{background:#fdecea;color:#7a1f14;border:2px solid var(--red)}
  #pageAlert.ok{background:#e6f6ea;color:#0d5c26;border:2px solid var(--green)}
  #pageAlert.info{background:#fff3cf;color:var(--navy);border:2px solid var(--navy)}
  .stars{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
  .stars label{cursor:pointer}
  .stars input{position:absolute;opacity:0;width:1px;height:1px}
  .stars span{display:inline-block;font-size:1.9rem;line-height:1;padding:6px 8px;border-radius:10px;border:2px solid var(--border);color:var(--muted);background:#fff}
  .stars label.lit span{border-color:var(--navy);background:#fff8e2;color:#b8860b}
  .stars input:focus-visible + span{outline:3px solid var(--navy);outline-offset:2px;box-shadow:0 0 0 6px var(--yellow)}
  label{display:block;font-weight:600;font-size:.88rem;color:var(--navy);margin:10px 0 6px}
  textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--border);border-radius:10px;padding:10px 12px;min-height:88px;resize:vertical}
  textarea:focus{border-color:var(--navy);outline:none}
  .error-text{color:var(--red);font-size:.84rem;font-weight:600;min-height:1.2em;margin:6px 0 0}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .btn{font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;font-weight:800;font-size:.95rem;padding:11px 18px;border-radius:12px;border:2px solid var(--navy);cursor:pointer;background:var(--yellow);color:var(--navy);box-shadow:0 4px 0 var(--navy);text-decoration:none;display:inline-block}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
  .btn[disabled]{opacity:.65;cursor:wait}
  .btn.ghost{background:#fff}
  .meta{font-size:.86rem;color:var(--muted)}
  .kv{display:grid;gap:6px;font-size:.94rem}
  .kv div strong{color:var(--navy)}
  .done-stars{font-size:1.6rem;color:#b8860b;letter-spacing:2px}
  .site-footer{background:var(--navy);color:#dbe2f0;padding:22px 16px 30px}
  .site-foot-inner{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
  .site-foot-brand{font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;font-weight:800;color:#fff;font-size:1.05rem}
  .site-foot-links{display:flex;gap:16px;flex-wrap:wrap}
  .site-foot-links a{color:var(--yellow);font-size:.86rem;font-weight:600;text-decoration:none}
  .site-foot-links a:hover{text-decoration:underline}
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a class="site-brand" href="index.html" aria-label="ApnaShift home">ApnaShift<small>Shifting • Transport</small></a>
    <nav class="site-nav" id="siteNav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="create-booking.html">Book</a>
      <a href="customer-dashboard.html">My Bookings</a>
      <a href="help.html">Help</a>
    </nav>
    <button id="navMenuBtn" aria-expanded="false" aria-controls="siteNav" aria-label="Menu kholo">☰</button>
  </div>
</header>

<main>
  <h1>Trip Rating</h1>
  <p class="sub" id="bookLine">Booking load ho rahi hai…</p>

  <div id="pageAlert" role="alert" aria-live="assertive"></div>

  <section class="card" id="rateCard" aria-labelledby="rateTitle" hidden>
    <h2 id="rateTitle">Kitne star doge?</h2>
    <div class="kv" id="tripInfo"></div>
    <div class="stars" id="starsBox" role="radiogroup" aria-label="1 se 5 star chuno"></div>
    <label for="commentBox">Comment (optional)</label>
    <textarea id="commentBox" maxlength="500" placeholder="Example: Driver samay par aaya, samaan ache se rakha"></textarea>
    <p class="error-text" id="rateErr"></p>
    <div class="controls">
      <button type="button" class="btn" id="submitBtn">Submit Karein</button>
      <a class="btn ghost" id="backLink" href="customer-dashboard.html">Wapas</a>
    </div>
  </section>

  <section class="card" id="doneCard" aria-labelledby="doneTitle" hidden>
    <h2 id="doneTitle">Aap rating de chuke hain</h2>
    <div id="doneBody"></div>
    <div class="controls">
      <a class="btn ghost" id="doneBackLink" href="customer-dashboard.html">Wapas</a>
    </div>
  </section>

<footer class="site-footer">
  <div class="site-foot-inner">
    <div class="site-foot-brand">ApnaShift</div>
    <div class="site-foot-links">
      <a href="index.html">Home</a>
      <a href="help.html">Help</a>
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms &amp; Conditions</a>
    </div>
  </div>
</footer>
</main>

<script>
(function(){
  "use strict";
  // Backend base URL with local development fallback (same on all pages —
  // localhost pages talk to localhost API, production pages to production,
  // so login tokens always match the API that issued them).
  var API_BASE_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.protocol === "file:") ? "http://localhost:3000" : "https://apnashiftapp-production.up.railway.app";
  var TOKEN_KEY = "apnashift_user_token";

  function getToken(){
    try{ return localStorage.getItem(TOKEN_KEY); }catch(e){ return null; }
  }
  if(!getToken()){
    window.location.href = "user-auth.html";
    return;
  }

  var qs = {};
  try {
    window.location.search.replace(/^\?/, "").split("&").forEach(function(p){
      var kv = p.split("="); if(kv[0]) qs[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || "");
    });
  } catch(e){}
  var bookingId = qs.id || "";
  if(!/^[0-9a-fA-F-]{36}$/.test(bookingId)){
    showAlert("err", "Booking ID sahi nahi hai (?id= lagakar kholo).");
    document.getElementById("bookLine").textContent = "Booking nahi mili.";
    return;
  }

  var alertBox = document.getElementById("pageAlert");
  var bookLine = document.getElementById("bookLine");
  var rateCard = document.getElementById("rateCard");
  var doneCard = document.getElementById("doneCard");
  var tripInfo = document.getElementById("tripInfo");
  var starsBox = document.getElementById("starsBox");
  var commentBox = document.getElementById("commentBox");
  var rateErr = document.getElementById("rateErr");
  var submitBtn = document.getElementById("submitBtn");
  var picked = 0;

  function showAlert(type, msg){
    if(!msg){ alertBox.className = "alert"; alertBox.textContent = ""; return; }
    alertBox.className = "alert show " + (type === "err" ? "err" : type === "ok" ? "ok" : "info");
    alertBox.textContent = msg;
  }
  function esc(v){
    return String(v === undefined || v === null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function authHeaders(){
    return { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() };
  }
  function readBody(res){
    return res.json().then(function(data){
      return { status: res.status, body: data };
    }).catch(function(){
      return { status: res.status, body: null };
    });
  }
  function addrText(p){
    if(!p) return "–";
    if(typeof p === "string") return p;
    return p.address || "–";
  }
  function starStr(n){
    var s = "";
    for(var i = 1; i <= 5; i++){ s += (i <= n ? "★" : "☆"); }
    return s;
  }
  function fmtDate(v){
    if(!v) return "–";
    var d = new Date(v);
    if(isNaN(d.getTime())) return String(v);
    return d.toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  }

  // Star buttons (click + tap + keyboard — real radio inputs).
  for(var s = 1; s <= 5; s++){
    (function(n){
      var label = document.createElement("label");
      var input = document.createElement("input");
      input.type = "radio";
      input.name = "stars";
      input.value = String(n);
      input.setAttribute("aria-label", n + " star");
      var span = document.createElement("span");
      span.textContent = "★ " + n;
      label.appendChild(input);
      label.appendChild(span);
      label.addEventListener("click", function(){ setPicked(n); });
      label.addEventListener("keydown", function(ev){
        if(ev.key === " " || ev.key === "Enter"){ ev.preventDefault(); setPicked(n); }
      });
      starsBox.appendChild(label);
    })(s);
  }
  function setPicked(n){
    picked = n;
    var labels = starsBox.querySelectorAll("label");
    for(var i = 0; i < labels.length; i++){
      labels[i].classList.toggle("lit", i < n);
      var inp = labels[i].querySelector("input");
      if(inp) inp.checked = (i + 1) === n;
    }
    rateErr.textContent = "";
  }

  function showDone(rating){
    rateCard.hidden = true;
    doneCard.hidden = false;
    document.getElementById("doneBody").innerHTML =
      '<div class="done-stars" aria-label="' + esc(rating.stars) + ' star">' + esc(starStr(rating.stars)) + "</div>" +
      (rating.comment ? "<p>" + esc(rating.comment) + "</p>" : "") +
      '<p class="meta">' + esc(fmtDate(rating.created_at)) + " ko di gayi</p>";
  }

  // Pehle booking verify (delivered?), phir rating check.
  fetch(API_BASE_URL + "/api/bookings/" + encodeURIComponent(bookingId), { headers: authHeaders() })
    .then(readBody)
    .then(function(result){
      if(result.status === 401){ window.location.href = "user-auth.html"; throw new Error("unauth"); }
      if(result.status === 404){ showAlert("err", "Ye booking tumhari nahi hai ya mili nahi."); throw new Error("notfound"); }
      if(result.status !== 200 || !result.body || !result.body.booking) throw new Error("load");
      var b = result.body.booking;
      bookLine.textContent = "Booking #" + b.id;
      if(b.status !== "delivered"){
        showAlert("info", "Trip abhi complete nahi hui — delivered hone ke baad rating de sakoge.");
        throw new Error("notdelivered");
      }
      tripInfo.innerHTML =
        "<div><strong>Trip:</strong> " + esc(addrText(b.pickup)) + " → " + esc(addrText(b.drop)) + "</div>" +
        "<div><strong>Kiraya:</strong> Rs " + esc(b.price_rs) + "</div>";
      return fetch(API_BASE_URL + "/api/bookings/" + encodeURIComponent(bookingId) + "/rating", { headers: authHeaders() })
        .then(readBody)
        .then(function(r2){
          if(r2.status === 401){ window.location.href = "user-auth.html"; throw new Error("unauth"); }
          if(r2.status === 200 && r2.body && r2.body.rating){
            bookLine.textContent = "Booking #" + b.id + " — rated";
            showDone(r2.body.rating);
            return null;
          }
          rateCard.hidden = false;
          return b;
        });
    })
    .catch(function(err){
      if(err && (err.message === "unauth" || err.message === "notfound" || err.message === "notdelivered")) return;
      showAlert("err", "Load nahi hua — internet check karke refresh karo.");
    });

  submitBtn.addEventListener("click", function(){
    if(!picked){
      rateErr.textContent = "1 se 5 tak star chuno.";
      return;
    }
    rateErr.textContent = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Bheja ja raha hai…";
    var payload = { stars: picked };
    var comment = commentBox.value.trim();
    if(comment) payload.comment = comment;
    fetch(API_BASE_URL + "/api/bookings/" + encodeURIComponent(bookingId) + "/rating", {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify(payload)
    }).then(readBody).then(function(result){
      if(result.status === 401){ window.location.href = "user-auth.html"; return; }
      if(result.status === 201 && result.body && result.body.rating){
        showAlert("ok", "Rating ke liye shukriya!");
        showDone(result.body.rating);
        return;
      }
      var code = result.body && result.body.error;
      if(result.status === 409 && code === "already_rated"){
        showAlert("info", "Is booking ki rating pehle hi di ja chuki hai.");
      } else if(result.status === 409){
        showAlert("err", "Delivery poori hone ke baad hi rating di ja sakti hai.");
      } else if(result.status === 429){
        showAlert("err", "Bahut koshish ho gayi — thodi der rukkar try karo.");
      } else if(result.status >= 500){
        showAlert("err", "Server me dikkat hai — thodi der baad try karo.");
      } else {
        var detail = result.body && result.body.details && result.body.details[0] && result.body.details[0].message;
        showAlert("err", detail || "Rating nahi bheji gayi — dobara try karo.");
      }
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Karein";
    }).catch(function(){
      showAlert("err", "Internet me dikkat hai — connection check karke try karo.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Karein";
    });
  });

  var navMenuBtn = document.getElementById("navMenuBtn"), siteNav = document.getElementById("siteNav");
  if(navMenuBtn && siteNav){
    navMenuBtn.addEventListener("click", function(){
      var open = siteNav.classList.toggle("open");
      navMenuBtn.setAttribute("aria-expanded", open ? "true" : "false");
    });
  }
})();
</script>
</body>
</html>
