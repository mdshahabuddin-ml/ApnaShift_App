openapi: 3.0.3
info:
  title: ApnaShift Backend (MVP)
  description: On-demand shifting API — pickup, mini truck, mini tractor. Auth via Bearer JWT.
  version: 0.1.0
servers:
  - url: http://localhost:3000
    description: Local dev
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, example: false }
        error: { type: string, example: invalid_credentials }
    VehicleType:
      type: string
      enum: [pickup, mini_truck, mini_tractor]
    Coord:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90, example: 22.7196 }
        lng: { type: number, minimum: -180, maximum: 180, example: 75.8577 }
    AddressPoint:
      allOf:
        - $ref: '#/components/schemas/Coord'
        - type: object
          required: [address]
          properties:
            address: { type: string, example: '12 MG Road, Indore' }
    PublicUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        role: { type: string, enum: [user, driver, admin] }
    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid, nullable: true }
        pickup: { $ref: '#/components/schemas/AddressPoint' }
        drop: { $ref: '#/components/schemas/AddressPoint' }
        vehicle_type: { $ref: '#/components/schemas/VehicleType' }
        helper_needed: { type: boolean }
        item_description: { type: string }
        scheduled_time: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true, description: 'Set on delivered, else null' }
        distance_km: { type: number }
        price_rs: { type: number }
        status:
          type: string
          enum: [pending, accepted, arrived, in_transit, delivered, cancelled]
        payment_method:
          type: string
          enum: [cash, online, upi]
        commission_percent:
          type: number
          nullable: true
          description: Creation-time snapshot from pricing_rules (rate lock)
        disputed: { type: boolean }
        dispute_reason: { type: string, nullable: true }
        cancellation:
          type: object
          nullable: true
          description: Set only when cancelled, else null
          properties:
            reason: { type: string, enum: [wrong_pickup, wrong_drop, wrong_vehicle, changed_plan, duplicate, driver_issue, other] }
            cancelled_by: { type: string, enum: [user, driver, admin, system] }
            cancelled_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Paginated:
      type: object
      required: [ok, page, limit, total]
      properties:
        ok: { type: boolean, example: true }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 3 }
paths:
  /api/health:
    get:
      summary: Health (no DB)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  service: { type: string, example: apnashift-backend }
                  time: { type: string, format: date-time }
  /api/ready:
    get:
      summary: Readiness (DB check)
      security: []
      responses:
        '200':
          description: DB up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  db: { type: string, example: up }
  /api/auth/register:
    post:
      summary: Register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, password]
              properties:
                name: { type: string, example: Rahul Sharma }
                phone: { type: string, example: '98765 43210' }
                password: { type: string, minLength: 8, example: password123 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  token: { type: string }
                  user: { $ref: '#/components/schemas/PublicUser' }
        '409': { description: Phone taken (phone_taken), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/login:
    post:
      summary: Login (user/driver/admin by phone)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string, example: '9876543210' }
                password: { type: string, example: password123 }
      responses:
        '200':
          description: OK, JWT with {id, role}
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  token: { type: string }
                  user: { $ref: '#/components/schemas/PublicUser' }
        '401': { description: invalid_credentials (wrong phone or password, same), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/me:
    get:
      summary: Own profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  user: { $ref: '#/components/schemas/PublicUser' }
  /api/auth/forgot-password:
    post:
      summary: Request password-reset OTP (zero-cost dev mode, always ok:true)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '9876543210' }
      responses:
        '200':
          description: OK always (enumeration-safe). Dev/test returns debug_otp when OTP_DEV_RETURN=1 or non-production.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  debug_otp: { type: string, example: '123456' }
        '429': { description: too_many_attempts (3 OTPs/15min per phone or IP limit) }
  /api/auth/reset-password:
    post:
      summary: Verify OTP + set new password (users/drivers)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp, new_password]
              properties:
                phone: { type: string, example: '9876543210' }
                otp: { type: string, example: '123456' }
                new_password: { type: string, minLength: 8, example: newpass123 }
      responses:
        '200': { description: Password changed }
        '400': { description: invalid_otp (wrong/expired/used) or validation_failed }
  /api/drivers/register:
    post:
      summary: Register driver (starts unverified)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, password, vehicle_type, vehicle_number]
              properties:
                name: { type: string, example: Dev Driver }
                phone: { type: string, example: '9123456789' }
                password: { type: string, minLength: 8 }
                vehicle_type: { $ref: '#/components/schemas/VehicleType' }
                vehicle_number: { type: string, example: MP09AB1234 }
      responses:
        '201': { description: Created (is_verified false) }
  /api/admin/login:
    post:
      summary: Admin login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string }
                password: { type: string }
      responses:
        '200': { description: OK, role admin }
  /api/bookings/estimate-price:
    post:
      summary: Price estimate (public, rate limited)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup, drop, vehicle_type]
              properties:
                pickup: { $ref: '#/components/schemas/Coord' }
                drop: { $ref: '#/components/schemas/Coord' }
                vehicle_type: { $ref: '#/components/schemas/VehicleType' }
                helper_needed: { type: boolean, default: false }
      responses:
        '200':
          description: Estimate (rates from DB, total rounded to Rs 10)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  distance_km: { type: number, example: 7.15 }
                  vehicle_type: { $ref: '#/components/schemas/VehicleType' }
                  base_fare: { type: number, example: 600 }
                  distance_fare: { type: number, example: 160.86 }
                  helper_charge: { type: number, example: 0 }
                  total: { type: number, example: 760 }
                  estimate_min: { type: number, example: 680 }
                  estimate_max: { type: number, example: 840 }
        '400':
          description: validation_failed or distance_too_far (>500 km, one-city MVP)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/bookings:
    post:
      summary: Create booking (user, price computed server-side)
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional retry key (A-Za-z0-9_-, 1-64). Same key + same payload replays 200 with same booking; same key + different payload is 422.
          schema: { type: string, example: order-abc-123 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup, drop, vehicle_type]
              properties:
                pickup: { $ref: '#/components/schemas/AddressPoint' }
                drop: { $ref: '#/components/schemas/AddressPoint' }
                vehicle_type: { $ref: '#/components/schemas/VehicleType' }
                helper_needed: { type: boolean, default: false }
                item_description: { type: string }
                scheduled_time: { type: string, format: date-time, description: 'Optional, must be now/future (past date is 400)' }
      responses:
        '201':
          description: Created (status pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  booking: { $ref: '#/components/schemas/Booking' }
        '200':
          description: Idempotent replay (same key + same payload, same booking)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  booking: { $ref: '#/components/schemas/Booking' }
        '400':
          description: validation_failed (incl. past scheduled_time) or distance_too_far (>500 km) or invalid_idempotency_key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: idempotency_conflict (same key, different payload)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      summary: Own bookings, paginated (user)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: OK }
  /api/bookings/{id}:
    get:
      summary: Own booking by id (others get 404)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '404': { description: not_found }
  /api/bookings/{id}/cancel:
    patch:
      summary: Cancel own booking with reason (pending/accepted only, atomic)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [wrong_pickup, wrong_drop, wrong_vehicle, changed_plan, duplicate, driver_issue, other] }
      responses:
        '200': { description: Cancelled (booking.cancellation has reason/by/at) }
        '400': { description: validation_failed (reason missing/invalid) }
        '404': { description: not_found }
        '409': { description: invalid_transition (non-cancellable stage) }
  /api/bookings/{id}/rating:
    get:
      summary: Read own rating for a booking (404 not_rated if none)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK (rating) }
        '404': { description: not_found / not_rated }
    post:
      summary: Rate own delivered booking, once
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5, example: 5 }
                comment: { type: string, example: time par aaya }
      responses:
        '201': { description: Created }
        '409': { description: not_delivered or already_rated }
  /api/drivers/{id}/ratings:
    get:
      summary: Driver ratings (public, no phone numbers)
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: average, count, last 10 comments }
  /api/driver/bookings/available:
    get:
      summary: Pending bookings for driver's vehicle (verified driver)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: OK }
        '403': { description: driver_unverified }
  /api/driver/bookings/{id}/accept:
    patch:
      summary: Accept booking (atomic, one winner)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Accepted }
        '409': { description: already_accepted }
  /api/driver/bookings/{id}/status:
    patch:
      summary: Advance status (accepted→arrived→in_transit→delivered; delivered sets delivered_at)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [arrived, in_transit, delivered] }
      responses:
        '200': { description: Updated }
        '409': { description: invalid_transition }
  /api/driver/bookings:
    get:
      summary: Own history, paginated (driver)
      responses:
        '200': { description: OK }
  /api/driver/earnings/weekly:
    get:
      summary: Last 7 days delivered earnings by delivered_at (driver)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  period: { type: string, example: 7d }
                  completed_count: { type: integer, example: 1 }
                  earnings_rs: { type: number, example: 760 }
  /api/admin/drivers:
    get:
      summary: Drivers by status (admin, paginated)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, verified, review], default: pending } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: OK }
        '403': { description: forbidden (non-admin) }
  /api/admin/drivers/{id}/verify:
    patch:
      summary: Verify driver (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Verified }
  /api/admin/drivers/{id}/reject:
    patch:
      summary: Reject driver with reason (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, example: Documents unclear }
      responses:
        '200': { description: Rejected }
  /api/admin/drivers/{id}/deactivate:
    patch:
      summary: Deactivate driver (admin, is_active false)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Deactivated }
        '404': { description: not_found }
  /api/admin/users/{id}/reset-password:
    patch:
      summary: Reset a user's password (admin, audited)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: Updated (no hash in response) }
        '400': { description: validation_failed }
        '404': { description: not_found }
  /api/admin/drivers/{id}/reset-password:
    patch:
      summary: Reset a driver's password (admin, audited)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: Updated (no hash in response) }
        '400': { description: validation_failed }
        '404': { description: not_found }
  /api/admin/accounts/lookup:
    get:
      summary: Find user/driver accounts by phone (admin, safe fields only)
      parameters:
        - { name: phone, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: OK (accounts array, never hashes) }
        '400': { description: validation_failed }
  /api/admin/drivers/{id}/reactivate:
    patch:
      summary: Reactivate driver (admin, is_active true)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Reactivated }
        '404': { description: not_found }
  /api/admin/drivers/flagged:
    get:
      summary: needs_review drivers (admin, no auto-ban)
      responses:
        '200': { description: OK }
  /api/admin/bookings:
    get:
      summary: All bookings with filters + totals (admin)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, accepted, arrived, in_transit, delivered, cancelled] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: city, in: query, schema: { type: string } }
      responses:
        '200': { description: total + revenue_rs + rows }
  /api/admin/bookings/{id}/assign:
    patch:
      summary: Manually assign driver (pending only, admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driver_id]
              properties:
                driver_id: { type: string, format: uuid }
      responses:
        '200': { description: Accepted }
        '409': { description: invalid_transition or driver_unavailable }
  /api/admin/pricing-rules:
    get:
      summary: Current rates (admin)
      responses:
        '200': { description: 3 rules }
    put:
      summary: Edit rates + history + audit in one transaction (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_type]
              properties:
                vehicle_type: { $ref: '#/components/schemas/VehicleType' }
                base_rs: { type: number, minimum: 0, example: 400 }
                per_km_rs: { type: number, minimum: 0 }
                helper_rs: { type: number, minimum: 0 }
      responses:
        '200': { description: rule + history_id }
  /api/admin/pricing-rules/history:
    get:
      summary: Rate change history (admin)
      responses:
        '200': { description: OK }
  /api/admin/stats:
    get:
      summary: Dashboard stats (admin; completed/revenue bucketed by delivered_at)
      responses:
        '200':
          description: today/week/total + verified drivers
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  today:
                    type: object
                    properties:
                      bookings: { type: integer }
                      completed: { type: integer }
                      cancelled: { type: integer }
                      revenue_rs: { type: number }
                  drivers:
                    type: object
                    properties:
                      verified_active: { type: integer }
  /api/enterprise/inquiries:
    post:
      summary: Submit enterprise inquiry (public, rate limited)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, phone, company_name]
              properties:
                full_name: { type: string, example: Priya Sharma }
                email: { type: string, example: you@company.com }
                phone: { type: string, example: '9876543210' }
                company_name: { type: string, example: Sharma Retail Pvt Ltd }
                website: { type: string }
                designation: { type: string }
                business_type: { type: string, enum: [ecommerce, retail, manufacturing, construction, hospitality, healthcare, education, corporate, other] }
                company_size: { type: string, enum: [1-10, 11-50, 51-200, 201-500, 500+] }
                cities: { type: string }
                operating_state: { type: string }
                locations_count: { type: integer }
                services_required: { type: array, items: { type: string } }
                vehicle_types: { type: array, items: { type: string } }
                fleet_size: { type: string }
                monthly_trips: { type: string }
                start_date: { type: string, format: date }
                service_frequency: { type: string, enum: [daily, weekly, monthly, on_demand] }
                budget_range: { type: string }
                requirements: { type: string }
      responses:
        '201': { description: Created, status NEW }
        '409': { description: duplicate_inquiry (same email + company, 30 days) }
    get:
      summary: List enterprise inquiries (admin, paginated, status/search filters)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [NEW, CONTACTED, IN_DISCUSSION, CONVERTED, CLOSED] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: OK }
        '403': { description: forbidden (non-admin) }
  /api/enterprise/inquiries/{id}/status:
    patch:
      summary: Update inquiry status (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [NEW, CONTACTED, IN_DISCUSSION, CONVERTED, CLOSED] }
      responses:
        '200': { description: Updated }
        '404': { description: not_found }
  /api/driver/bookings/{id}/accept:
    patch:
      summary: Accept a pending booking (driver, verified)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Accepted }
        '403': { description: commission_limit_exceeded (outstanding over COMMISSION_DUE_LIMIT) }
        '404': { description: not_found }
        '409': { description: already_accepted }
  /api/driver/bookings/{id}/location:
    post:
      summary: Report live GPS (driver, assigned + active booking only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                accuracy_m: { type: number, minimum: 0, maximum: 10000 }
                speed_mps: { type: number, minimum: 0, maximum: 100 }
                heading_deg: { type: number, minimum: 0, maximum: 360, description: 'Compass degrees clockwise from true north (Geolocation heading). Null when device has no compass.' }
      responses:
        '201': { description: Stored + fanned out to SSE subscribers }
        '400': { description: validation_failed }
        '403': { description: driver_unverified / driver_inactive }
        '404': { description: not_found (unassigned or other driver booking) }
        '409': { description: tracking_not_active (pending/delivered/cancelled) }
        '429': { description: too_many_attempts }
  /api/bookings/{id}/location:
    get:
      summary: Latest GPS + tracking state (user, own booking)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: history, in: query, schema: { type: integer, default: 1, maximum: 50 } }
      responses:
        '200': { description: OK (state live/stale/offline/ended, driver w/o phone) }
        '404': { description: not_found }
  /api/bookings/{id}/location/stream:
    get:
      summary: Live GPS stream SSE (user, own booking)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: text/event-stream (snapshot + location events) }
        '404': { description: not_found }
  /api/admin/tracking/active:
    get:
      summary: Active trips with last GPS + state (admin)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        '200': { description: OK (counts + actives) }
        '403': { description: forbidden (non-admin) }
  /api/geo/config:
    get:
      summary: Map tile template (Geoapify, key from env) + server tracking thresholds
      responses:
        '200': { description: OK (tiles.template, thresholds.stale_after_ms/offline_after_ms; OSM fallback when key missing) }
        '401': { description: unauthorized }
  /api/geo/autocomplete:
    get:
      summary: Address suggestions via Geoapify (server-side proxy, auth-gated)
      parameters:
        - { name: text, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, default: 5, maximum: 10 } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200': { description: OK (results[].formatted/lat/lng) }
        '503': { description: geoapify_unavailable (key missing) }
  /api/geo/route:
    get:
      summary: Driving route pickup->drop via Geoapify (for tracking map polyline)
      parameters:
        - { name: pickup_lat, in: query, required: true, schema: { type: number } }
        - { name: pickup_lng, in: query, required: true, schema: { type: number } }
        - { name: drop_lat, in: query, required: true, schema: { type: number } }
        - { name: drop_lng, in: query, required: true, schema: { type: number } }
      responses:
        '200': { description: OK (distance_m, duration_s, geometry[].lat/lng) }
        '503': { description: geoapify_unavailable (key missing) }
  /api/driver/ledger:
    get:
      summary: Own money summary + payments + settlements (driver)
      responses:
        '200': { description: OK (derived summary, no stored balance) }
        '403': { description: driver_unverified / forbidden }
  /api/driver/profile:
    patch:
      summary: Update own UPI ID (driver, verified not required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                upi_id: { type: string, nullable: true, example: naam@okhdfc }
      responses:
        '200': { description: Updated }
        '400': { description: validation_failed }
  /api/driver/commission-due:
    get:
      summary: Own outstanding commission + due limit (driver)
      responses:
        '200': { description: OK (outstanding_rs, limit_rs) }
  /api/driver/bookings/{id}/flag-dispute:
    post:
      summary: Flag own assigned booking as disputed (driver)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Flagged (money untouched) }
        '404': { description: not_found }
  /api/bookings/{id}/flag-dispute:
    post:
      summary: Flag own booking as disputed (user)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Flagged (money untouched) }
        '404': { description: not_found }
  /api/admin/commission:
    get:
      summary: Current commission pct + history (admin)
      responses:
        '200': { description: OK }
    put:
      summary: Change commission pct for future deliveries (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pct]
              properties:
                pct: { type: number, minimum: 0, maximum: 100, example: 15 }
      responses:
        '200': { description: Updated (history + audit in tx) }
        '400': { description: validation_failed }
  /api/admin/ledger:
    get:
      summary: All payments with adjustment deltas (admin, paginated)
      parameters:
        - { name: driver_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [owed, partial, settled] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: OK }
  /api/admin/payments/{id}:
    get:
      summary: One payment + adjustment trail (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '404': { description: not_found }
  /api/admin/driver-balances:
    get:
      summary: Per-driver settlement dashboard (admin)
      responses:
        '200': { description: OK (trips, cash, earning, commission, settled, outstanding) }
  /api/admin/settlements:
    get:
      summary: Settlement history (admin, optional driver filter)
      parameters:
        - { name: driver_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
    post:
      summary: Record a settlement with FIFO allocation (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driver_id, amount_rs, method]
              properties:
                driver_id: { type: string, format: uuid }
                amount_rs: { type: number, exclusiveMinimum: 0, example: 150 }
                method: { type: string, enum: [cash, bank_transfer, upi] }
                reference_no: { type: string }
                notes: { type: string }
                settled_at: { type: string, format: date-time }
      responses:
        '201': { description: Created (+ outstanding_rs) }
        '400': { description: validation_failed }
        '404': { description: not_found (driver) }
        '409': { description: settlement_exceeds_outstanding / duplicate_settlement }
  /api/admin/adjustments:
    post:
      summary: Append-only payment correction (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id, reason]
              properties:
                payment_id: { type: string, format: uuid }
                commission_delta_paise: { type: integer, example: 500 }
                earning_delta_paise: { type: integer }
                reason: { type: string }
      responses:
        '201': { description: Created }
        '404': { description: not_found }
        '409': { description: settlement_finalized (payment in PAID/DISPUTED week) }
  /api/driver/payments/{id}/confirm-cash:
    post:
      summary: Driver confirms COD cash received (driver, own pending cash only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK (payment collected) }
        '404': { description: not_found (missing/foreign/undelivered) }
        '409': { description: already_confirmed / not_cash / invalid_payment_state }
  /api/driver/settlement-periods:
    get:
      summary: Own weekly settlements (driver)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DUE, PARTIALLY_PAID, PAID, OVERDUE, DISPUTED] } }
        - { name: week_start, in: query, schema: { type: string, example: '2026-09-28' } }
      responses:
        '200': { description: OK }
  /api/driver/settlement-periods/{id}:
    get:
      summary: Own week detail + items (driver)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '404': { description: not_found }
  /api/admin/settlement-periods/generate:
    post:
      summary: Generate weekly settlement(s), idempotent (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                driver_id: { type: string, format: uuid }
                week_start: { type: string, example: '2026-09-28' }
      responses:
        '200': { description: OK (created + skipped) }
        '400': { description: invalid_week }
        '404': { description: unknown_driver }
  /api/admin/settlement-periods:
    get:
      summary: List weekly settlements (admin, filters + OVERDUE derived)
      parameters:
        - { name: driver_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [DUE, PARTIALLY_PAID, PAID, OVERDUE, DISPUTED] } }
        - { name: week_start, in: query, schema: { type: string, example: '2026-09-28' } }
      responses:
        '200': { description: OK }
  /api/admin/settlement-periods/{id}:
    get:
      summary: Week detail + per-method split (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '404': { description: not_found }
  /api/admin/settlement-periods/{id}/payments:
    post:
      summary: Pay down one week, FIFO inside the week (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_rs, method]
              properties:
                amount_rs: { type: number, exclusiveMinimum: 0, example: 150 }
                method: { type: string, enum: [cash, bank_transfer, upi] }
                reference_no: { type: string }
                notes: { type: string }
      responses:
        '201': { description: Created (+ period + outstanding_rs) }
        '400': { description: validation_failed }
        '404': { description: not_found }
        '409': { description: settlement_finalized / settlement_disputed / settlement_exceeds_outstanding / duplicate_settlement }
  /api/admin/settlement-periods/{id}/dispute:
    patch:
      summary: Freeze a week as disputed (admin, PAID stays final)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: not_found }
        '409': { description: settlement_finalized / already_disputed }
  /api/admin/settlement-periods/{id}/resolve:
    patch:
      summary: Unfreeze a disputed week (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '404': { description: not_found }
        '409': { description: not_disputed }
