# ApnaShift backend — Nginx reverse proxy.
# Install: sudo cp deploy/nginx-apnashift.conf /etc/nginx/sites-available/apnashift
#          (file me server_name wali line me api.example.com ko apne domain se badlo)
#          sudo ln -s /etc/nginx/sites-available/apnashift /etc/nginx/sites-enabled/apnashift
#          sudo nginx -t && sudo systemctl reload nginx
# NOTE: ye file sirf port 80 ke liye hai. Certbot khud 443 block jod dega:
#   sudo certbot --nginx -d api.example.com
# Upstream hamesha 127.0.0.1:3000 hai — Node ko internet par directly expose mat karo.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com; # <-- APNA DOMAIN LIKHO (DNS A record server IP par pehle bana lo)

    # API me 100kb JSON limit hai, isliye 1m bahut hai (bade upload ka koi endpoint nahi).
    client_max_body_size 1m;

    # Certbot isi path par challenge file rakhta hai — proxy se pehle allow rakho.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000; # Node app (PM2) yahin sun raha hai
        proxy_http_version 1.1; # keepalive + upgrade headers ke liye
        proxy_set_header Host $host; # app ko asli domain dikhe
        proxy_set_header X-Real-IP $remote_addr; # rate-limit sahi client IP dekhe (TRUST_PROXY=1 ke saath)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # chain me client IP aage badhao
        proxy_set_header X-Forwarded-Proto $scheme; # app jaane http ya https (secure cookie/redirect ke liye)
        proxy_read_timeout 30s; # DB slow ho to 30s tak jawab ka intezaar
        proxy_connect_timeout 5s; # Node down ho to 5s me 502 do, latko mat
    }

    # Nginx version banner chhupao (info leak kam).
    server_tokens off;
}
