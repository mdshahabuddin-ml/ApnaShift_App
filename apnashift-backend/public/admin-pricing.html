<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing | ApnaShift Admin</title>
<meta name="description" content="ApnaShift admin — view and update pricing rates.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14213d;
    --yellow:#fcbf49;
    --bg:#f4f6fa;
    --border:#c9d0de;
    --ink:#20242e;
    --muted:#5b6070;
    --red:#c0392b;
    --green:#1a7a3a;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height:1.6;
  }
  :focus-visible{
    outline:3px solid var(--navy);
    outline-offset:2px;
    box-shadow:0 0 0 4px var(--yellow);
    border-radius:6px;
  }
  .site-header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:50}
  .site-header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .site-brand{font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;font-weight:800;font-size:1.3rem;line-height:1;color:#fff;text-decoration:none}
  .site-brand small{display:block;font-family:"Noto Sans",system-ui,sans-serif;font-weight:600;font-size:.64rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--yellow)}
  .site-header .spacer{flex:1}
  .logout-btn{background:transparent;border:2px solid var(--yellow);border-radius:8px;color:var(--yellow);font:inherit;font-weight:800;padding:6px 12px;cursor:pointer}
  main{max-width:960px;margin:0 auto;padding:20px 16px 40px}
  .card{background:#fff;border:2px solid var(--navy);border-radius:var(--radius);padding:18px;box-shadow:6px 6px 0 var(--yellow);margin-bottom:16px}
  .card h1,.card h2{font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;color:var(--navy);margin:0 0 8px}
  .card h1{font-size:1.5rem}
  .card h2{font-size:1.2rem;margin-top:16px}
  .sub{margin:0 0 10px;color:var(--muted);font-size:.9rem}
  .alert{display:none;border-radius:10px;padding:11px 12px;font-size:.9rem;font-weight:600;margin:0 0 14px}
  .alert.show{display:block}
  .alert.err{background:#fdecea;color:#7a1f14;border:2px solid var(--red)}
  .alert.ok{background:#e6f6ea;color:#0d5c26;border:2px solid var(--green)}
  table{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:10px}
  th,td{border:1px solid var(--border);padding:7px 8px;text-align:left;vertical-align:top}
  th{background:#f7f3e8;color:var(--navy)}
  .table-wrap{overflow-x:auto}
  .form-grid{display:grid;gap:10px;margin-top:10px}
  @media(min-width:640px){.form-grid{grid-template-columns:repeat(2,1fr)}}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-weight:600;font-size:.84rem;color:var(--navy)}
  select,input{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--border);border-radius:6px;padding:9px 11px}
  .btn{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:.9rem;padding:9px 16px;border-radius:10px;border:2px solid var(--navy);background:var(--yellow);color:var(--navy);cursor:pointer}
  .btn.ghost{background:#fff}
  .btn:disabled{opacity:.6;cursor:wait}
  .meta{font-size:.82rem;color:var(--muted)}
  .empty,.loading{color:var(--muted);font-size:.9rem}
  .back{font-size:.9rem;margin-top:12px}
  .back a{color:var(--navy);font-weight:700}
  .site-footer{background:var(--navy);color:#dbe2f0;padding:22px 16px 30px}
  .site-foot-inner{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
  .site-foot-brand{font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;font-weight:800;color:#fff;font-size:1.05rem}
  .site-foot-links{display:flex;gap:16px;flex-wrap:wrap}
  .site-foot-links a{color:var(--yellow);font-size:.86rem;font-weight:600;text-decoration:none}
  .site-foot-links a:hover{text-decoration:underline}
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a class="site-brand" href="admin-home.html" aria-label="ApnaShift admin home">ApnaShift<small>Admin Panel</small></a>
    <div class="spacer"></div>
    <button class="logout-btn" id="logoutBtn" type="button" data-i18n="pg_admin-pricing_01">Logout</button>
  </div>
</header>

<main>
  <div class="alert" id="pageAlert" role="alert" aria-live="assertive"></div>

  <section class="card" aria-labelledby="pageTitle">
    <h1 id="pageTitle" data-i18n="pg_admin-pricing_02">Pricing</h1>
    <p class="sub" data-i18n="pg_admin-pricing_03">Rates apply only to new bookings — snapshots of old bookings never change.</p>
    <p><button class="btn ghost" id="loadBtn" type="button" data-i18n="pg_admin-pricing_04">Load rates</button></p>
    <div class="table-wrap" id="ratesWrap" aria-live="polite"><p class="loading" data-i18n="pg_admin-pricing_05">Press Load.</p></div>

    <h2 data-i18n="pg_admin-pricing_06">Update rate</h2>
    <div class="form-grid">
      <div class="field">
        <label for="vehicleSel" data-i18n="pg_admin-pricing_07">Vehicle</label>
        <select id="vehicleSel">
          <option value="pickup" data-i18n="pg_admin-pricing_08">pickup</option>
          <option value="mini_truck" data-i18n="pg_admin-pricing_09">mini_truck</option>
          <option value="mini_tractor" data-i18n="pg_admin-pricing_10">mini_tractor</option>
        </select>
      </div>
      <div class="field">
        <label for="baseInp" data-i18n="pg_admin-pricing_11">Base Rs (blank = no change)</label>
        <input type="number" id="baseInp" min="0" placeholder="250" data-i18n-ph="pg_admin-pricing_12">
      </div>
      <div class="field">
        <label for="kmInp" data-i18n="pg_admin-pricing_13">Per km Rs (blank = no change)</label>
        <input type="number" id="kmInp" min="0" step="0.5" placeholder="17.5" data-i18n-ph="pg_admin-pricing_14">
      </div>
      <div class="field">
        <label for="helperInp" data-i18n="pg_admin-pricing_15">Helper Rs (blank = no change)</label>
        <input type="number" id="helperInp" min="0" placeholder="200" data-i18n-ph="pg_admin-pricing_16">
      </div>
      <div class="field">
        <label for="minInp">Minimum fare Rs (blank = no change)</label>
        <input type="number" id="minInp" min="0" placeholder="250">
      </div>
      <div class="field">
        <label for="smallInp">Size chhota extra Rs (blank = no change)</label>
        <input type="number" id="smallInp" min="0" placeholder="0">
      </div>
      <div class="field">
        <label for="bigInp">Size bada extra Rs (blank = no change)</label>
        <input type="number" id="bigInp" min="0" placeholder="0">
      </div>
      <div class="field">
        <label for="w0100Inp">Weight 0-100 kg Rs (blank = no change)</label>
        <input type="number" id="w0100Inp" min="0" placeholder="0">
      </div>
      <div class="field">
        <label for="w100300Inp">Weight 100-300 kg Rs (blank = no change)</label>
        <input type="number" id="w100300Inp" min="0" placeholder="0">
      </div>
      <div class="field">
        <label for="w300500Inp">Weight 300-500 kg Rs (blank = no change)</label>
        <input type="number" id="w300500Inp" min="0" placeholder="0">
      </div>
      <div class="field">
        <label for="w500pInp">Weight 500+ kg Rs (blank = no change)</label>
        <input type="number" id="w500pInp" min="0" placeholder="0">
      </div>
      <div class="field">
        <label for="commInp" data-i18n="pg_admin-pricing_17">Commission % (blank = no change)</label>
        <input type="number" id="commInp" min="0" max="100" step="0.5" placeholder="15" data-i18n-ph="pg_admin-pricing_18">
      </div>
    </div>
    <p style="margin-top:10px"><button class="btn" id="saveBtn" type="button" data-i18n="pg_admin-pricing_19">Save rate</button></p>

    <h2 data-i18n="pg_admin-pricing_20">History</h2>
    <p><button class="btn ghost" id="histBtn" type="button" data-i18n="pg_admin-pricing_21">Load history</button></p>
    <div class="table-wrap" id="histWrap" aria-live="polite"><p class="loading" data-i18n="pg_admin-pricing_22">Press Load.</p></div>

    <p class="back"><a href="admin-home.html" data-i18n="pg_admin-pricing_23">← Admin Home</a> • <a href="admin-dashboard.html" data-i18n="pg_admin-pricing_24">Full dashboard</a></p>
  </section>
</main>

<footer class="site-footer">
  <div class="site-foot-inner">
    <div class="site-foot-brand">ApnaShift</div>
    <div class="site-foot-links">
      <a href="admin-home.html" data-i18n="pg_admin-pricing_25">Admin Home</a>
      <a href="admin-dashboard.html" data-i18n="pg_admin-pricing_26">Full Dashboard</a>
      <a href="mailto:support@apnashift.in?subject=ApnaShift%20Support%20Request">support@apnashift.in</a>
    </div>
  </div>
</footer>

<script>
(function(){
  "use strict";

  // Backend base URL with local development fallback (same on all pages —
  // localhost pages talk to localhost API, production pages to production,
  // so login tokens always match the API that issued them).
  var API_BASE_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.protocol === "file:") ? "http://localhost:3000" : "https://apnashiftapp-production.up.railway.app";
  var TOKEN_KEY = "apnashift_admin_token";

  function getToken(){ try { return localStorage.getItem(TOKEN_KEY); } catch(e){ return null; } }
  if(!getToken()){ window.location.href = "admin-login.html"; return; }

  var alertBox = document.getElementById("pageAlert");
  var ratesWrap = document.getElementById("ratesWrap");
  var histWrap = document.getElementById("histWrap");
  var loadBtn = document.getElementById("loadBtn");
  var saveBtn = document.getElementById("saveBtn");
  var histBtn = document.getElementById("histBtn");
  var vehicleSel = document.getElementById("vehicleSel");
  var baseInp = document.getElementById("baseInp");
  var kmInp = document.getElementById("kmInp");
  var helperInp = document.getElementById("helperInp");
  var minInp = document.getElementById("minInp");
  var smallInp = document.getElementById("smallInp");
  var bigInp = document.getElementById("bigInp");
  var w0100Inp = document.getElementById("w0100Inp");
  var w100300Inp = document.getElementById("w100300Inp");
  var w300500Inp = document.getElementById("w300500Inp");
  var w500pInp = document.getElementById("w500pInp");
  var commInp = document.getElementById("commInp");

  function showAlert(type, msg){
    if(!msg){ alertBox.className = "alert"; alertBox.textContent = ""; return; }
    alertBox.className = "alert show " + (type === "err" ? "err" : "ok");
    alertBox.textContent = msg;
  }
  function authHeaders(extra){
    var h = { "Authorization": "Bearer " + getToken() };
    if(extra){ for(var k in extra){ h[k] = extra[k]; } }
    return h;
  }
  function readBody(res){
    return res.json().then(function(data){
      return { status: res.status, body: data };
    }).catch(function(){
      return { status: res.status, body: null };
    });
  }
  function checkAuth(result){
    if(result.status === 401){
      try { localStorage.removeItem(TOKEN_KEY); } catch(e){}
      window.location.href = "admin-login.html";
      return true;
    }
    return false;
  }
  function esc(v){
    return String(v === undefined || v === null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function fmtDate(iso){
    if(!iso) return "—";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return String(iso);
    return d.toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  }

  function loadRates(){
    showAlert(null, "");
    loadBtn.disabled = true;
    ratesWrap.innerHTML = '<p class="loading">Loading…</p>';
    fetch(API_BASE_URL + "/api/admin/pricing-rules", { headers: authHeaders() })
      .then(readBody)
      .then(function(result){
        if(checkAuth(result)) return;
        if(result.status !== 200 || !result.body || result.body.ok !== true) throw new Error("load_failed");
        var rules = Array.isArray(result.body.rules) ? result.body.rules : [];
        if(!rules.length){ ratesWrap.innerHTML = '<p class="empty">No rates found.</p>'; return; }
        var h = "<table><tr><th>Vehicle</th><th>Base</th><th>Per km</th><th>Helper</th><th>Min</th><th>Chhota</th><th>Bada</th><th>W 0-100</th><th>W 100-300</th><th>W 300-500</th><th>W 500+</th><th>Comm. %</th><th>Updated</th></tr>";
        for(var i = 0; i < rules.length; i++){
          var r = rules[i];
          h += "<tr><td>" + esc(r.vehicle_type) + "</td><td>" + esc(r.base_rs) +
            "</td><td>" + esc(r.per_km_rs) + "</td><td>" + esc(r.helper_rs) +
            "</td><td>" + esc(r.minimum_fare) + "</td><td>" + esc(r.size_small_extra) +
            "</td><td>" + esc(r.size_big_extra) + "</td><td>" + esc(r.weight_0_100) +
            "</td><td>" + esc(r.weight_100_300) + "</td><td>" + esc(r.weight_300_500) +
            "</td><td>" + esc(r.weight_500_plus) + "</td><td>" + esc(r.commission_pct) +
            "</td><td>" + esc(fmtDate(r.updated_at)) + "</td></tr>";
        }
        ratesWrap.innerHTML = h + "</table>";
      })
      .catch(function(){
        ratesWrap.innerHTML = '<p class="empty">Could not load — please try again.</p>';
        showAlert("err", "Could not load rates.");
      })
      .then(function(){ loadBtn.disabled = false; });
  }

  function numOrUndef(el){
    var s = String(el.value || "").trim();
    if(s === "") return undefined;
    var n = Number(s);
    return isFinite(n) ? n : NaN;
  }

  function saveRate(){
    var body = { vehicle_type: vehicleSel.value };
    var b = numOrUndef(baseInp), k = numOrUndef(kmInp), hp = numOrUndef(helperInp), c = numOrUndef(commInp);
    var mn = numOrUndef(minInp), sm = numOrUndef(smallInp), bg = numOrUndef(bigInp);
    var w1 = numOrUndef(w0100Inp), w2 = numOrUndef(w100300Inp), w3 = numOrUndef(w300500Inp), w4 = numOrUndef(w500pInp);
    if(b === undefined && k === undefined && hp === undefined && c === undefined &&
       mn === undefined && sm === undefined && bg === undefined &&
       w1 === undefined && w2 === undefined && w3 === undefined && w4 === undefined){
      showAlert("err", "Fill at least one field.");
      return;
    }
    if(b !== undefined){ if(!(b >= 0)){ showAlert("err", "Base Rs must be 0 or more."); return; } body.base_rs = b; }
    if(k !== undefined){ if(!(k >= 0)){ showAlert("err", "Per km Rs must be 0 or more."); return; } body.per_km_rs = k; }
    if(hp !== undefined){ if(!(hp >= 0)){ showAlert("err", "Helper Rs must be 0 or more."); return; } body.helper_rs = hp; }
    if(mn !== undefined){ if(!(mn >= 0)){ showAlert("err", "Minimum fare must be 0 or more."); return; } body.minimum_fare = mn; }
    if(sm !== undefined){ if(!(sm >= 0)){ showAlert("err", "Chhota extra must be 0 or more."); return; } body.size_small_extra = sm; }
    if(bg !== undefined){ if(!(bg >= 0)){ showAlert("err", "Bada extra must be 0 or more."); return; } body.size_big_extra = bg; }
    if(w1 !== undefined){ if(!(w1 >= 0)){ showAlert("err", "Weight slab must be 0 or more."); return; } body.weight_0_100 = w1; }
    if(w2 !== undefined){ if(!(w2 >= 0)){ showAlert("err", "Weight slab must be 0 or more."); return; } body.weight_100_300 = w2; }
    if(w3 !== undefined){ if(!(w3 >= 0)){ showAlert("err", "Weight slab must be 0 or more."); return; } body.weight_300_500 = w3; }
    if(w4 !== undefined){ if(!(w4 >= 0)){ showAlert("err", "Weight slab must be 0 or more."); return; } body.weight_500_plus = w4; }
    if(c !== undefined){ if(!(c >= 0 && c <= 100)){ showAlert("err", "Commission must be between 0 and 100."); return; } body.commission_pct = c; }
    showAlert(null, "");
    saveBtn.disabled = true;
    fetch(API_BASE_URL + "/api/admin/pricing-rules", {
      method: "PUT",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify(body)
    }).then(readBody).then(function(result){
      if(checkAuth(result)) return;
      if(result.status === 200 && result.body && result.body.ok === true){
        showAlert("ok", "Rate saved (history #" + result.body.history_id + ").");
        baseInp.value = ""; kmInp.value = ""; helperInp.value = ""; commInp.value = "";
        minInp.value = ""; smallInp.value = ""; bigInp.value = "";
        w0100Inp.value = ""; w100300Inp.value = ""; w300500Inp.value = ""; w500pInp.value = "";
        loadRates();
        return;
      }
      if(result.status === 400) showAlert("err", "Invalid details — please check the values.");
      else showAlert("err", "Could not save — please try again.");
    }).catch(function(){
      showAlert("err", "Internet issue.");
    }).then(function(){ saveBtn.disabled = false; });
  }

  function loadHistory(){
    showAlert(null, "");
    histBtn.disabled = true;
    histWrap.innerHTML = '<p class="loading">Loading…</p>';
    fetch(API_BASE_URL + "/api/admin/pricing-rules/history?limit=20", { headers: authHeaders() })
      .then(readBody)
      .then(function(result){
        if(checkAuth(result)) return;
        if(result.status !== 200 || !result.body || result.body.ok !== true) throw new Error("load_failed");
        var arr = Array.isArray(result.body.history) ? result.body.history : [];
        if(!arr.length){ histWrap.innerHTML = '<p class="empty">History is empty.</p>'; return; }
        var h = "<table><tr><th>ID</th><th>Vehicle</th><th>Change</th><th>When</th></tr>";
        for(var i = 0; i < arr.length; i++){
          var x = arr[i];
          h += "<tr><td>" + esc(x.id) + "</td><td>" + esc(x.vehicle_type) +
            "</td><td><span class='meta'>" + esc(JSON.stringify(x.old)) + " → " +
            esc(JSON.stringify(x.new)) + "</span></td><td>" + esc(fmtDate(x.created_at)) + "</td></tr>";
        }
        histWrap.innerHTML = h + "</table>";
      })
      .catch(function(){
        histWrap.innerHTML = '<p class="empty">Could not load — please try again.</p>';
        showAlert("err", "Could not load history.");
      })
      .then(function(){ histBtn.disabled = false; });
  }

  loadBtn.addEventListener("click", loadRates);
  saveBtn.addEventListener("click", saveRate);
  histBtn.addEventListener("click", loadHistory);

  document.getElementById("logoutBtn").addEventListener("click", function(){
    try { localStorage.removeItem(TOKEN_KEY); } catch(e){}
    window.location.href = "admin-login.html";
  });

  loadRates();
})();
</script>
<script>window.PAGE_I18N={en:{page_title:'Pricing | ApnaShift Admin',meta_desc:'ApnaShift admin — view and update pricing rates.','pg_admin-pricing_01':'Logout','pg_admin-pricing_02':'Pricing','pg_admin-pricing_03':'Rates apply only to new bookings — snapshots of old bookings never change.','pg_admin-pricing_04':'Load rates','pg_admin-pricing_05':'Press Load.','pg_admin-pricing_06':'Update rate','pg_admin-pricing_07':'Vehicle','pg_admin-pricing_08':'pickup','pg_admin-pricing_09':'mini_truck','pg_admin-pricing_10':'mini_tractor','pg_admin-pricing_11':'Base Rs (blank = no change)','pg_admin-pricing_12':'350','pg_admin-pricing_13':'Per km Rs (blank = no change)','pg_admin-pricing_14':'17.5','pg_admin-pricing_15':'Helper Rs (blank = no change)','pg_admin-pricing_16':'200','pg_admin-pricing_17':'Commission % (blank = no change)','pg_admin-pricing_18':'15','pg_admin-pricing_19':'Save rate','pg_admin-pricing_20':'History','pg_admin-pricing_21':'Load history','pg_admin-pricing_22':'Press Load.','pg_admin-pricing_23':'← Admin Home','pg_admin-pricing_24':'Full dashboard','pg_admin-pricing_25':'Admin Home','pg_admin-pricing_26':'Full Dashboard'},hi:{page_title:'प्राइसिंग | ApnaShift एडमिन',meta_desc:'ApnaShift एडमिन — प्राइसिंग दरें देखें और अपडेट करें।','pg_admin-pricing_01':'लॉगआउट','pg_admin-pricing_02':'प्राइसिंग','pg_admin-pricing_03':'दरें सिर्फ नई बुकिंग पर लागू होती हैं — पुरानी बुकिंग के स्नैपशॉट कभी नहीं बदलते।','pg_admin-pricing_04':'दरें लोड करें','pg_admin-pricing_05':'लोड दबाएं।','pg_admin-pricing_06':'दर अपडेट करें','pg_admin-pricing_07':'वाहन','pg_admin-pricing_08':'पिकअप','pg_admin-pricing_09':'मिनी ट्रक','pg_admin-pricing_10':'मिनी ट्रैक्टर','pg_admin-pricing_11':'बेस रुपये (खाली = कोई बदलाव नहीं)','pg_admin-pricing_12':'350','pg_admin-pricing_13':'प्रति किमी रुपये (खाली = कोई बदलाव नहीं)','pg_admin-pricing_14':'17.5','pg_admin-pricing_15':'हेल्पर रुपये (खाली = कोई बदलाव नहीं)','pg_admin-pricing_16':'200','pg_admin-pricing_17':'कमीशन % (खाली = कोई बदलाव नहीं)','pg_admin-pricing_18':'15','pg_admin-pricing_19':'दर सेव करें','pg_admin-pricing_20':'इतिहास','pg_admin-pricing_21':'इतिहास लोड करें','pg_admin-pricing_22':'लोड दबाएं।','pg_admin-pricing_23':'← एडमिन होम','pg_admin-pricing_24':'पूरा डैशबोर्ड','pg_admin-pricing_25':'एडमिन होम','pg_admin-pricing_26':'पूरा डैशबोर्ड'}};</script>
<script src="lang.js"></script>
</body>
</html>
